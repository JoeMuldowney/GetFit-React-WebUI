name: ForgeVitaHQ WebUI CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            if [ ! -d "/var/www/forgevitahq/.git" ]; then
                git clone git@github.com:JoeMuldowney/GetFit-React-WebUI.git /var/www/forgevitahq
            else
                cd /var/www/forgevitahq
                git pull origin main
            fi
            
            git pull origin main
            docker compose up -d --build